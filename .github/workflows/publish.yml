name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # bundles npm >= 11.5.1, required for OIDC publish
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and test @cetridr/cetridr
        run: |
          pnpm run build
          pnpm test

      - name: Publish @cetridr/cetridr
        run: pnpm publish --provenance --access public

      - name: Build dsh-whale-rider
        run: pnpm --filter dsh-whale-rider run build

      - name: Publish dsh-whale-rider
        run: pnpm --filter dsh-whale-rider publish --provenance --access public
