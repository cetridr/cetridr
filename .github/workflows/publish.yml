name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # bundles npm >= 11.5.1, required for OIDC publish
          registry-url: 'https://registry.npmjs.org'

      - name: Build and test @cetridr/cetridr
        run: |
          npm install
          npm run build
          npm test

      - name: Publish @cetridr/cetridr
        run: npm publish --provenance --access public

      - name: Build dsh-whale-rider
        working-directory: packages/whale-rider
        run: |
          npm install
          npm run build

      - name: Publish dsh-whale-rider
        working-directory: packages/whale-rider
        run: npm publish --provenance --access public
