name: publish

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # check out the branch (not the detached tag) so pnpm's git check passes

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # bundles npm >= 11.5.1, required for OIDC publish
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and test @cetridr/cetridr
        run: |
          pnpm run build
          pnpm test

      - name: Publish @cetridr/cetridr
        run: pnpm publish --provenance --access public

      - name: Build dsh-whale-rider
        run: pnpm --filter dsh-whale-rider run build

      - name: Publish dsh-whale-rider
        run: pnpm --filter dsh-whale-rider publish --provenance --access public

  update-formula:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/cetridr/homebrew-cetridr.git" /tmp/tap
          node scripts/bump-formula.mjs "$VER" /tmp/tap/Formula/cetridr.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cetridr.rb
          git commit -m "cetridr ${VER}" || true
          git push
